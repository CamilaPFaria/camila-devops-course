Resources:
  WebServerEC2:
    Type: AWS::EC2::Instance
    Metadata:
      AWS::CloudFormation::Init:
        config:                                                 
          packages:  # packages: installs the httpd package using yum                                            
            yum:      # Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/deploying.applications.html                                          
              http: []
          services: # services: ensures httpd starts and runs automatically 
            systemd: # Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/deploying.applications.html
              httpd:
                enabled: true
                ensureRunning: true    
    Properties:
      ImageId: ami-04b938437b69a2c9c
      InstanceType: t3.micro
      KeyName: camiladevkeypair
      Tags:
        - Key: Name
        - Value: EC2-web-server
      EC2Role: !Ref EC2InstanceProfile ##this property assigns the role through InstanceProfile resource
      UserData: #UserData: Install the latest bootstrap tools and calls cfn-init
        Fn::Base64:
          !Sub |                                             
          #!/bin/bash
          yum install -y aws-cfn-bootstrap 
          /opt/aws/bin/cfn-init -v --stack ${AWS::StackName} --resource WebServerEC2 --region ${AWS::Region}
      # ===================================================================================
      #                                   PSEUDO PARAMETERS
      # ${AWS::StackName} and ${AWS::Region} are built-in variables that provide access to AWS env information. 
      # Ref.: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/pseudo-parameter-reference.html
      # 
      # ====================================================================================== 

        

 
  # ======================Metadata configuration==========================================================
  # EC2Instance:
  #  Type: AWS::EC2::Instance
  #  Metadata:                       # Metadata section for the resource
  #    AWS::CloudFormation::Init:    # Required key that cfn-init looks for
  #      config:                     # Configuration name (you can have multiple)
  #        packages:                 # Install packages
  #       files:                    # Create files
  #       commands:                 # Run commands
  #        services:                 # Start/stop services
  #
  # Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/deploying.applications.html
      
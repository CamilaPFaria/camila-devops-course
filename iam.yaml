Resources:
##Role to be assigned to the ec2 instance to access the webpage stored in the bucket
  EC2S3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      Descritpion: Role assigned to EC2 instance to access the bucket contents
      AssumeRolePolicyDocument: ##define which entities can assume the role
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com ##ec2 service is configured to assume the role
            Action:
              - sts:AssumeRole
  #==============================================================================================            
  #Role to assign to the lambda function resource to upload the website contents to the s3 bucket
  WebsiteUploadLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      Description: Role assigned to the Lambda fucntion to upload the contents of the website to the S3 bucket.
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
                Service: 
                  - lambda.amazonaws.com #Lambda service will have the role. 
            Action: sts:AssumeRole
        ManagedPolicyArns: #this is a ready to use policy that allows Lambda fucntions to create logs entries in CloudWatch when the code runs. It is needed for troubleshooting and debbuging. 
          - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
  #=========================================================================================================            
  S3AccessPolicy: ##defines what the role can access
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BucketAccess
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject #this policy allows that this role is able to only read the contents
              - s3:ListBucket
            Resource:
              - !GetAtt WebAssetsBucket.Arn          
              - !Sub "${WebAssetsBucket.Arn}/*"
      Roles:
      - !Ref EC2S3AccessRole
  #===============================================================================================================
  #This policy allows objects to be uploaded and deleted to/from the S3 bucket. This will be assigned to the WebsiteUploadLambdaRole and the role assigned to the Lambda function.  
    S3PutObjectPolicy:
      Type: AWS::IAM::Policy
      Properties:
        PolicyName: BucketUpload 
        PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:DeleteObject
                Resource: !Sub '${WebAssetsBucket.Arn}/*'
        Roles: 
        - !Ref WebsiteUploadLambdaRole         

  #================================================================================================================
  EC2RoleProfile:
        Type: AWS::IAM::InstanceProfile  ##This is needed becaused EC2 can't accept IAM role directly. The InstanceProfile resource passes the role credentials to an EC2 instance. 
        Properties:                       ##Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iam-instanceprofile.html
          Path: "/"                         ##Ref:https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
          Roles:
          - !Ref EC2S3AccessRole
        #==================================================================================================================================    
        ##Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iam-role.html
        ## https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iam-role.html#aws-resource-iam-role--examples
        ## https://docs.aws.amazon.com/AWSEC2/latest/UserGuide/iam-roles-for-amazon-ec2.html
        ## https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/quickref-iam.html
        #================================================================================================================================
        ##===============================================================================================================================
        
    #========================================================================================================= 
   






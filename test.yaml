Resources:
  WebServerEC2:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: ami-04b938437b69a2c9c
      InstanceType: t3.micro
      KeyName: camiladevkeypair
      Tags:
        - Key: Name
        - Value: EC2-web-server
      EC2Role: !Ref EC2InstanceProfile ##this property assigns the role through InstanceProfile resource
  WebAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: s3-webpage
      WebsiteConfiguration: ## property used to configure the bucket as a static website hosting (Ref.: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-s3-bucket.html)
        IndexDocument: index.html
        #ErrorDocument: error.html
  EC2S3AccessRole:
    Type: AWS::IAM::Role
    Properties:
      Descritpion: Role assigned to EC2 instance to access the bucket contents
      AssumeRolePolicyDocument: ##define which entities can assume the role
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service:
                - ec2.amazonaws.com ##ec2 service is configured to assume the role
            Action:
              - sts:AssumeRole
  S3AccessPolicy: ##defines what the role can access
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: BucketAccess
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Action:
              - s3:GetObject #this policy allows that this role is able to only read the contents
              - s3:ListBucket
            Resource:
              - !GetAtt WebAssetsBucket.Arn          
              - !Sub "${WebAssetsBucket.Arn}/*"
      Roles:
        - !Ref EC2S3AccessRole
  EC2InstanceProfile:
        Type: AWS::IAM::InstanceProfile  ##This is needed becaused EC2 can't accept IAM role directly. The InstanceProfile resource passes the role credentials to an EC2 instance. 
        Properties:                       ##Ref: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-iam-instanceprofile.html
          Path: "/"                         ##Ref:https://docs.aws.amazon.com/IAM/latest/UserGuide/id_roles_use_switch-role-ec2_instance-profiles.html
          Roles:
          - !Ref EC2S3AccessRole               


Resources:
  WebsiteUploadLambda:
    Type: AWS::Lambda:Function
    Properties: 
      Runtime: nodejs18.x
      Handler: index.handler
      Role: !GetAtt S3UploadLambdaRole.Arn
      Code:
        ZipFile: |
          const { S3Client, PutObjectCommand } = require('@aws-sdk/client-s3');
          const response = require('cfn-response');
          const s3 = new S3Client();

          exports.handler = async (event, context) => {
            if (event.RequestType === 'Delete') {
              return await response.send(event, context, response.SUCCESS);
            }
            try {
              await s3.send(new PutObjectCommand({
                Bucket: event.ResourceProperties.TargetBucket,
                Key: 'index.html',
                Body: '<html><body><h1>Camila Pulz de Faria - L00205475!</h1></body></html>',
                ContentType: 'text/html'
              }));
              await response.send(event, context, response.SUCCESS);
            } catch (error) {
              console.error(error);
              await response.send(event, context, response.FAILED);
            }
          };

   # 4. Custom Resource Trigger
  UploadIndexHtml:
    Type: Custom::S3Objects
    Properties:
      ServiceToken: !GetAtt WebisteUploadLambda.Arn
      TargetBucket: !Ref WebAssetsBucket        

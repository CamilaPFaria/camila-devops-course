Resources:
  WebAssetsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: s3-webpage
      WebsiteConfiguration: ## property used to configure the bucket as a static website hosting (Ref.: https://docs.aws.amazon.com/AWSCloudFormation/latest/TemplateReference/aws-resource-s3-bucket.html)
        IndexDocument: index.html
        #ErrorDocument: error.html
      ##For more information: https://catalog.us-east-1.prod.workshops.aws/workshops/df7f72cf-4f10-4664-acb6-b30dc8d4bcf0/en-US/lab2
#========================================================================================================================================
  UploadIndexHtml:
    Type: Custom::S3Objects
    Properties:
      ServiceToken: !GetAtt WebsiteUploadLambda.Arn
      TargetBucket: !Ref WebAssetsBucket       



